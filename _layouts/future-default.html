<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Future Debrief</title>

  <meta name="description" content="{{ page.description | default: 'Future Debrief - Modernising maritime analysis' }}">
  <meta property="og:title" content="{{ page.title | default: 'Future Debrief' }}">
  <meta property="og:description" content="{{ page.description | default: 'Modernising maritime analysis' }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/future.css' | relative_url }}">

  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
</head>
<body class="future-debrief">
  {% include future-nav.html %}
  {{ content }}
  {% include future-footer.html %}
  <script src="{{ '/assets/js/track-filter.js' | relative_url }}" defer></script>
</body>
</html>
