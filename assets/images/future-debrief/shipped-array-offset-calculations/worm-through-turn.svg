<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .track { stroke: #4CAF50; stroke-width: 3; fill: none; }
    .vessel { fill: #2E7D32; stroke: #1B5E20; stroke-width: 2; }
    .plain { stroke: #FF8F00; stroke-width: 2; fill: #FFB300; }
    .worm { stroke: #8E24AA; stroke-width: 2; fill: #AB47BC; }
    .bearing { stroke-width: 1.5; fill: none; stroke-dasharray: 3,3; }
    .label { font-size: 13px; fill: #333; }
    .title { font-size: 16px; font-weight: bold; fill: #333; }
    .legend { font-size: 12px; fill: #555; }
    .annotation { font-size: 11px; fill: #666; font-style: italic; }
  </style>

  <text x="400" y="26" class="title" text-anchor="middle">
    PLAIN vs WORM: array centre through a 90° turn
  </text>

  <!-- Map area -->
  <rect x="40" y="50" width="720" height="380" stroke="#CCC" fill="#FAFAFA"/>

  <!-- Track path: straight north then east after turn -->
  <!-- Track waypoints in screen coords:
       A = early south point  (200, 400)
       B = turn point         (200, 150)
       C = end, east of turn  (580, 150)
       Vessel = at C
  -->
  <polyline class="track" points="200,400 200,150 580,150"/>

  <!-- Track fix markers -->
  <circle cx="200" cy="400" r="5" fill="#4CAF50"/>
  <circle cx="200" cy="150" r="5" fill="#4CAF50"/>
  <circle cx="580" cy="150" r="5" fill="#4CAF50"/>

  <text x="185" y="418" class="label" text-anchor="end">fix t₀ (-5.0, 49.98)</text>
  <text x="185" y="140" class="label" text-anchor="end">fix t₁ turn (-5.0, 50.0)</text>
  <text x="594" y="140" class="label">fix t₂ now (-4.98, 50.0)</text>

  <!-- Vessel at fix t₂ -->
  <polygon class="vessel" points="580,140 590,160 580,155 570,160"
           transform="rotate(90, 580, 150)"/>

  <!-- PLAIN origin: backtrack 2km along reverse bearing 270° (west) from vessel -->
  <!-- 2km ≈ 380 pixels on horizontal axis in this layout -->
  <circle class="plain" cx="200" cy="150" r="8"/>
  <line class="bearing plain" x1="580" y1="150" x2="200" y2="150"/>
  <text x="395" y="144" class="label" text-anchor="middle" fill="#E65100">
    PLAIN backtrack (straight-line 2 km west)
  </text>

  <!-- WORM origin: walks back along the path. 2km consumes ~1.43km on horizontal
       leg + ~0.57km on the southbound leg, placing origin south of the turn. -->
  <circle class="worm" cx="200" cy="257" r="8"/>
  <path class="bearing worm" d="M 580 150 L 200 150 L 200 257" stroke-dasharray="4,4"/>
  <text x="215" y="215" class="label" fill="#6A1B9A">
    WORM walks back
  </text>
  <text x="215" y="232" class="label" fill="#6A1B9A">
    along the path
  </text>

  <!-- Coordinate annotations -->
  <text x="195" y="170" class="annotation" text-anchor="end" fill="#E65100">
    PLAIN origin (-5.000, 50.000)
  </text>
  <text x="195" y="275" class="annotation" text-anchor="end" fill="#6A1B9A">
    WORM origin (-5.000, 49.99487)
  </text>

  <!-- Legend -->
  <g transform="translate(50, 445)">
    <rect x="0" y="0" width="16" height="3" fill="#4CAF50"/>
    <text x="22" y="5" class="legend">vessel track</text>

    <circle cx="120" cy="1" r="5" class="plain"/>
    <text x="132" y="5" class="legend">PLAIN array centre (reverse-bearing backtrack)</text>

    <circle cx="410" cy="1" r="5" class="worm"/>
    <text x="422" y="5" class="legend">WORM array centre (path-following backtrack)</text>
  </g>

  <text x="50" y="478" class="annotation">
    Both origins serve as the start of every bearing line drawn from contacts reported while the vessel is at fix t₂ with 2 km sensor offset.
  </text>
</svg>
